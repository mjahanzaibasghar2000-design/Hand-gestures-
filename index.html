<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZAIB_BALOCH — Fire & Plasma AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Space Mono',monospace;}

/* VIDEO */
.video-wrap{position:absolute;inset:0;}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(0.4) contrast(1.2) saturate(0.6);z-index:0;}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);z-index:5;pointer-events:none;}

/* START OVERLAY */
#overlay{position:absolute;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity 0.8s;}
#overlay.out{opacity:0;pointer-events:none;}

.logo-wrap{position:relative;margin-bottom:50px;}
.logo-glow{position:absolute;inset:-40px;background:radial-gradient(circle,rgba(255,45,85,0.15),transparent 70%);border-radius:50%;animation:breathe 2s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.15);opacity:1}}

.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,14vw,130px);line-height:0.9;letter-spacing:6px;text-align:center;position:relative;}
.lz{background:linear-gradient(180deg,#fff 0%,#ffd60a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.lb{background:linear-gradient(180deg,#ff2d55 0%,#bf5af2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:11px;letter-spacing:6px;color:rgba(255,255,255,0.2);text-transform:uppercase;text-align:center;margin-top:8px;}

/* Fire preview on overlay */
#previewCanvas{width:200px;height:120px;display:block;margin:0 auto 40px;}

.enter-btn{padding:18px 56px;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:5px;background:transparent;border:2px solid rgba(255,45,85,0.6);color:#ff2d55;border-radius:50px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.3s;text-shadow:0 0 20px rgba(255,45,85,0.5);}
.enter-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,45,85,0.1),rgba(191,90,242,0.1));opacity:0;transition:opacity 0.3s;}
.enter-btn:hover{border-color:rgba(255,45,85,1);box-shadow:0 0 40px rgba(255,45,85,0.4),inset 0 0 40px rgba(255,45,85,0.05);transform:scale(1.03);}
.enter-btn:hover::before{opacity:1;}
.hint{margin-top:18px;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.15);text-transform:uppercase;}

/* BRAND */
.brand{position:absolute;top:20px;right:20px;z-index:20;text-align:right;pointer-events:none;}
.brand-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;}
.brand-z{background:linear-gradient(90deg,#fff,#ffd60a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.brand-b{background:linear-gradient(90deg,#ff2d55,#bf5af2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.brand-sub{font-size:7px;letter-spacing:3px;color:rgba(255,255,255,0.15);margin-top:1px;}

/* SIG */
.sig{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none;}
.sig-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:5px;}
.sig-sub{font-size:7px;letter-spacing:3px;color:rgba(255,255,255,0.12);margin-top:2px;}

/* HUD */
#hud{position:absolute;top:20px;left:20px;z-index:20;display:none;flex-direction:column;gap:8px;pointer-events:none;}
.hpanel{background:rgba(0,0,0,0.5);border:1px solid rgba(255,45,85,0.15);border-radius:10px;padding:10px 14px;}
.hrow{display:flex;justify-content:space-between;gap:18px;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.25);text-transform:uppercase;margin-bottom:5px;}
.hrow:last-child{margin-bottom:0;}
.hval{color:#ff2d55;font-weight:700;}

/* GESTURE POPUP */
#gPop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,10vw,100px);letter-spacing:6px;opacity:0;pointer-events:none;transition:opacity 0.1s;white-space:nowrap;}
#gPop.on{opacity:1;}

/* THEME BAR */
#themeBar{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);z-index:20;display:none;gap:6px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.06);border-radius:30px;padding:6px;}
.tbtn{background:transparent;border:1px solid transparent;color:rgba(255,255,255,0.3);padding:5px 13px;border-radius:20px;cursor:pointer;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;transition:all 0.2s;}
.tbtn.on{background:rgba(255,45,85,0.15);border-color:rgba(255,45,85,0.4);color:#ff2d55;}

/* PLASMA MODE indicator */
#plasmaInd{position:absolute;top:50%;right:24px;transform:translateY(-50%);z-index:20;display:none;flex-direction:column;align-items:center;gap:5px;pointer-events:none;}
.pind-dot{width:8px;height:8px;border-radius:50%;background:var(--c,#ff2d55);box-shadow:0 0 12px var(--c,#ff2d55);animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.pind-txt{font-size:7px;letter-spacing:2px;color:rgba(255,255,255,0.3);}
</style>
</head>
<body>

<div id="overlay">
  <div class="logo-wrap">
    <div class="logo-glow"></div>
    <div class="logo"><span class="lz">ZAIB</span><br/><span class="lb">BALOCH</span></div>
    <div class="logo-sub">Fire & Plasma Hand AR</div>
  </div>
  <canvas id="previewCanvas" width="200" height="120"></canvas>
  <button class="enter-btn" id="startBtn">🔥 ENTER</button>
  <div class="hint">Camera allow karein · Chrome best hai</div>
</div>

<div class="video-wrap">
  <video autoplay playsinline></video>

</div>

<!-- BRAND -->
<div class="brand">
  <div class="brand-logo"><span class="brand-z">ZAIB</span><span class="brand-b">_BALOCH</span></div>

</div>

<!-- HUD -->
<div id="hud">
  <div class="hpanel">
    <div class="hrow">Hands <span class="hval" id="uH">0</span></div>

<!-- THEMES -->
<div id="themeBar">
  <button class="tbtn on" data-t="inferno">🔥 Inferno</button>

  <button class="tbtn" data-t="zaib">⭐ Zaib</button>
  <button class="tbtn" data-t="ice">❄ Ice</button>
  <button class="tbtn" data-t="toxic">☢ Toxic</button>
</div>

<!-- SIG -->
<div class="sig">
  <div class="sig-logo"><span class="brand-z">ZAIB</span><span class="brand-b">_BALOCH</span></div>
  <div class="sig-sub">Pakistan 🇵🇰 · Fire & Plasma AR</div>
</div>

<script>
// ═══════════════════════════════════════════════
// ZAIB_BALOCH — FIRE & PLASMA AR
// ═══════════════════════════════════════════════
const video     = document.querySelector('video');
const canvas    = document.getElementById('fxCanvas');
const ctx       = canvas.getContext('2d');
const prevC     = document.getElementById('previewCanvas');
const prevCtx   = prevC.getContext('2d');

let W = innerWidth, H = innerHeight;
let time = 0, lastT = performance.now(), fps = 0, fFrames = 0, lastFpsT = performance.now();
let hands = [], handVel = 0;
let theme = 'inferno';

// Pools
let fireParticles  = [];
let smokeParticles = [];
let plasmaArcs     = [];
let ribbons        = []; // per-fingertip trail history
let shockwaves     = [];
let emberPool      = [];

const FTIPS = [4, 8, 12, 16, 20];

// THEME PALETTES
const THEMES = {
  inferno: { fire:['#fff9a0','#ffcc00','#ff8800','#ff3300','#ff0033','#990000'], plasma:'#ff6600', accent:'#ff2d55' },
  plasma:  { fire:['#ffffff','#e0f0ff','#80c8ff','#0088ff','#0033cc','#001166'], plasma:'#00e5ff', accent:'#00e5ff' },
  zaib:    { fire:['#ffffff','#ffd60a','#ff8800','#ff2d55','#bf5af2','#660033'], plasma:'#bf5af2', accent:'#bf5af2' },
  ice:     { fire:['#ffffff','#d0f0ff','#80e8ff','#00ccff','#0066cc','#003388'], plasma:'#00ffcc', accent:'#00ffcc' },
  toxic:   { fire:['#ffffff','#ddff00','#88ee00','#00dd00','#007700','#003300'], plasma:'#00ff44', accent:'#00ff44' },
};

function tc() { return THEMES[theme]; }

const uH = document.getElementById('uH');
const uF = document.getElementById('uF');
const uM = document.getElementById('uM');
const uG = document.getElementById('uG');
const gPop = document.getElementById('gPop');
const plasmaInd = document.getElementById('plasmaInd');

// ─── RESIZE ───────────────────────────────────
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W; canvas.height = H;
  // Re-init ribbon history
  ribbons = FTIPS.map(() => []);
}
addEventListener('resize', resize);
resize();

// ─── THEME SWITCHER ───────────────────────────
document.querySelectorAll('.tbtn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tbtn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    theme = b.dataset.t;
    fireParticles = []; smokeParticles = []; ribbons = FTIPS.map(()=>[]);
  };
});

// ─── START BUTTON ─────────────────────────────
document.getElementById('startBtn').onclick = () => {
  initAudio();
  initMediaPipe();
  document.getElementById('overlay').classList.add('out');
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('themeBar').style.display = 'flex';
  requestAnimationFrame(mainLoop);
  setTimeout(()=>document.getElementById('overlay').style.display='none', 900);
};

// ─── PREVIEW FIRE ─────────────────────────────
let prevFireP = [];
function runPreview() {
  const W2=200, H2=120;
  prevCtx.fillStyle='rgba(0,0,0,0.3)';
  prevCtx.fillRect(0,0,W2,H2);
  // Spawn
  for(let i=0;i<3;i++) {
    prevFireP.push({x:100+(Math.random()-0.5)*30,y:110,vx:(Math.random()-0.5)*1.5,vy:-(1.5+Math.random()*2.5),life:1,size:4+Math.random()*4,phase:Math.random()});
  }
  // Draw
  for(let i=prevFireP.length-1;i>=0;i--) {
    const p=prevFireP[i];
    p.x+=p.vx+(Math.sin(p.phase+Date.now()*0.003)*0.4);
    p.y+=p.vy; p.life-=0.018; p.size*=0.99;
    if(p.life<=0){prevFireP.splice(i,1);continue;}
    const t=1-p.life;
    const colors=['#fff9a0','#ffcc00','#ff6600','#ff2200','#660000'];
    const ci=Math.min(Math.floor(t*5),4);
    prevCtx.beginPath();
    prevCtx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    prevCtx.fillStyle=colors[ci];
    prevCtx.globalAlpha=p.life*0.9;
    prevCtx.fill();
  }
  prevCtx.globalAlpha=1;
  // ZAIB text on preview
  prevCtx.font="700 14px 'Bebas Neue',sans-serif";
  prevCtx.textAlign='center';
  prevCtx.fillStyle='rgba(255,214,10,0.4)';
  prevCtx.fillText('ZAIB_BALOCH',100,20);
  requestAnimationFrame(runPreview);
}
runPreview();

// ─── AUDIO ────────────────────────────────────
let aCtx=null, humO=null, humG=null;
function initAudio() {
  try {
    aCtx = new (AudioContext||webkitAudioContext)();
    humO = aCtx.createOscillator(); humG = aCtx.createGain();
    humO.type='sine'; humO.frequency.value=80;
    humG.gain.value=0;
    humO.connect(humG); humG.connect(aCtx.destination);
    humO.start();
  } catch(e) {}
}
function zapSound(freq=800) {
  if(!aCtx)return;
  const o=aCtx.createOscillator(), g=aCtx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(freq,aCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(30,aCtx.currentTime+0.15);
  g.gain.setValueAtTime(0.35,aCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+0.15);
  o.connect(g); g.connect(aCtx.destination);
  o.start(); o.stop(aCtx.currentTime+0.18);
}
function plasmaSound() {
  if(!aCtx)return;
  const o=aCtx.createOscillator(), g=aCtx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(200+Math.random()*200,aCtx.currentTime);
  g.gain.setValueAtTime(0.05,aCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+0.05);
  o.connect(g); g.connect(aCtx.destination);
  o.start(); o.stop(aCtx.currentTime+0.05);
}
function updateHum(count, dist) {
  if(!aCtx||!humG)return;
  if(count<2){humG.gain.setTargetAtTime(0,aCtx.currentTime,0.15);return;}
  humO.frequency.setTargetAtTime(80+(1-Math.min(dist,1))*300,aCtx.currentTime,0.1);
  humG.gain.setTargetAtTime(0.06+(1-Math.min(dist,1))*0.1,aCtx.currentTime,0.1);
}

// ─── HELPERS ──────────────────────────────────
function pt(lm){return {x:lm.x*W, y:lm.y*H};}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(min,max){return min+Math.random()*(max-min);}

// ─── GESTURE ──────────────────────────────────
let lastPinch=[false,false];
let popTimer=null;
function showPopup(txt, col) {
  gPop.textContent=txt; gPop.style.color=col; gPop.style.textShadow=`0 0 40px ${col}`;
  gPop.classList.add('on');
  clearTimeout(popTimer);
  popTimer=setTimeout(()=>gPop.classList.remove('on'),900);
}

function detectGesture() {
  if(!hands.length)return;
  hands.forEach((hand,i)=>{
    const th=hand[4], ix=hand[8];
    const dist2=d(th,ix);
    const pinching=dist2<0.05;
    if(pinching&&!lastPinch[i]) {
      const mid={x:(th.x+ix.x)/2*W,y:(th.y+ix.y)/2*H};
      addShockwave(mid.x,mid.y);
      zapSound(600+i*200);
      showPopup('PINCH!',tc().accent);
      uG.textContent='PINCH!';
      // Big plasma burst
      for(let j=0;j<30;j++) addEmber(mid.x,mid.y);
    }
    lastPinch[i]=pinching;
  });
  if(hands[0]) {
    const sp=d(hands[0][8],hands[0][20]);
    const pct=Math.min(Math.round(sp*300),100);
    if(!lastPinch.includes(true)) uG.textContent=pct>55?'OPEN':'FIST';
  }
}

// ─── FIRE SYSTEM ──────────────────────────────
function spawnFire(x, y, intensity=1) {
  const pal = tc().fire;
  for(let i=0;i<Math.ceil(4*intensity);i++) {
    fireParticles.push({
      x, y,
      vx: rand(-1.4,1.4)*intensity,
      vy: rand(-4,-1.5)*intensity,
      life: 1,
      decay: rand(0.012,0.022),
      size: rand(5,14)*intensity,
      wobble: rand(0,Math.PI*2),
      wobbleSpeed: rand(2,5),
      palIdx: 0
    });
  }
  // Smoke
  if(Math.random()>0.7) {
    smokeParticles.push({
      x:x+rand(-8,8), y:y-10,
      vx:rand(-0.6,0.6), vy:rand(-0.8,-0.2),
      life:1, size:rand(8,20),
      decay:rand(0.005,0.01)
    });
  }
}

function drawFire() {
  ctx.save();
  for(let i=fireParticles.length-1;i>=0;i--) {
    const p=fireParticles[i];
    p.x += p.vx + Math.sin(p.wobble+time*p.wobbleSpeed)*0.8;
    p.y += p.vy;
    p.vy -= 0.04; // accelerate up
    p.life -= p.decay;
    p.size *= 0.985;
    p.wobble += 0.08;
    if(p.life<=0||p.size<0.5){fireParticles.splice(i,1);continue;}

    const pal=tc().fire;
    const t=1-p.life;
    const ci=Math.min(Math.floor(t*(pal.length-1)),pal.length-2);
    const blendT=(t*(pal.length-1))-ci;

    // Gradient radial for each fire particle
    const grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*p.life);
    grd.addColorStop(0,'rgba(255,255,255,'+p.life*0.9+')');
    grd.addColorStop(0.3,pal[ci]+'CC');
    grd.addColorStop(0.7,pal[Math.min(ci+1,pal.length-1)]+'44');
    grd.addColorStop(1,'transparent');

    ctx.globalCompositeOperation='screen';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    ctx.fillStyle=grd;
    ctx.fill();
  }

  // Smoke (dark, rises higher)
  ctx.globalCompositeOperation='source-over';
  for(let i=smokeParticles.length-1;i>=0;i--) {
    const p=smokeParticles[i];
    p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; p.size+=0.3;
    if(p.life<=0){smokeParticles.splice(i,1);continue;}
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=`rgba(40,40,60,${p.life*0.15})`;
    ctx.fill();
  }
  ctx.restore();
}

// ─── RIBBON TRAILS ────────────────────────────
function updateRibbons(tipPositions) {
  tipPositions.forEach((pos,i)=>{
    if(!ribbons[i]) ribbons[i]=[];
    ribbons[i].push({...pos, t:Date.now()});
    // Keep last 25 positions
    if(ribbons[i].length>25) ribbons[i].shift();
  });
}

function drawRibbons() {
  const pal=tc().fire;
  FTIPS.forEach((_,i)=>{
    const trail=ribbons[i];
    if(!trail||trail.length<3)return;
    for(let j=1;j<trail.length;j++) {
      const p1=trail[j-1], p2=trail[j];
      const alpha=(j/trail.length)*0.5;
      const color=pal[Math.min(Math.floor((1-j/trail.length)*3),pal.length-1)];
      ctx.beginPath();
      ctx.moveTo(p1.x,p1.y);
      ctx.lineTo(p2.x,p2.y);
      ctx.strokeStyle=color;
      ctx.globalAlpha=alpha;
      ctx.lineWidth=Math.max((j/trail.length)*6,1);
      ctx.globalCompositeOperation='screen';
      ctx.stroke();
    }
  });
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

// ─── PLASMA BALL ──────────────────────────────
let plasmaTime=0;
function drawPlasma(cx, cy, radius, intensity) {
  const col=tc().plasma;
  const t=time;
  ctx.save();

  // Outer aura
  for(let layer=3;layer>=0;layer--) {
    const r=radius*(1+layer*0.4)*(0.85+Math.sin(t*3+layer)*0.15);
    const alpha=0.04+layer*0.02;
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grd.addColorStop(0,col+'44');
    grd.addColorStop(0.5,col+'22');
    grd.addColorStop(1,'transparent');
    ctx.globalCompositeOperation='screen';
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=grd;
    ctx.fill();
  }

  // Core bright sphere
  const coreGrd=ctx.createRadialGradient(cx-radius*0.3,cy-radius*0.3,0,cx,cy,radius);
  coreGrd.addColorStop(0,'rgba(255,255,255,0.9)');
  coreGrd.addColorStop(0.3,col+'cc');
  coreGrd.addColorStop(0.7,col+'55');
  coreGrd.addColorStop(1,'transparent');
  ctx.globalCompositeOperation='screen';
  ctx.beginPath();
  ctx.arc(cx,cy,radius,0,Math.PI*2);
  ctx.fillStyle=coreGrd;
  ctx.fill();

  // Plasma filaments (animated lines inside)
  for(let f=0;f<6;f++) {
    const angle=t*1.5+f*(Math.PI/3);
    const innerR=radius*0.3;
    const outerR=radius*(0.7+Math.sin(t*2+f)*0.3);
    const x1=cx+Math.cos(angle)*innerR;
    const y1=cy+Math.sin(angle)*innerR;
    const x2=cx+Math.cos(angle+0.4)*outerR;
    const y2=cy+Math.sin(angle+0.4)*outerR;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    const mx=cx+(Math.cos(angle+0.2)*outerR*0.6)+(Math.random()-0.5)*20;
    const my=cy+(Math.sin(angle+0.2)*outerR*0.6)+(Math.random()-0.5)*20;
    ctx.quadraticCurveTo(mx,my,x2,y2);
    ctx.strokeStyle='rgba(255,255,255,0.6)';
    ctx.lineWidth=1.5;
    ctx.shadowBlur=10;
    ctx.shadowColor=col;
    ctx.globalCompositeOperation='screen';
    ctx.stroke();
  }
  ctx.shadowBlur=0;

  // Plasma text label
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=0.5+Math.sin(t*4)*0.3;
  ctx.font="700 10px 'Space Mono',monospace";
  ctx.textAlign='center';
  ctx.fillStyle=col;
  ctx.fillText('PLASMA',cx,cy-radius-10);
  ctx.globalAlpha=1;
  ctx.restore();
}

// Plasma lightning to fingertips
function drawPlasmaArcs(cx, cy, tips) {
  const col=tc().plasma;
  tips.forEach(pos => {
    if(Math.random()>0.4) {
      ctx.save();
      ctx.globalCompositeOperation='screen';
      ctx.strokeStyle='rgba(255,255,255,0.7)';
      ctx.shadowBlur=15;
      ctx.shadowColor=col;
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      // Jagged lightning path
      const steps=4;
      let px=cx,py=cy;
      for(let s=0;s<steps;s++) {
        const t2=(s+1)/steps;
        const nx=lerp(cx,pos.x,t2)+(Math.random()-0.5)*40*(1-t2);
        const ny=lerp(cy,pos.y,t2)+(Math.random()-0.5)*40*(1-t2);
        ctx.lineTo(nx,ny);
        px=nx;py=ny;
      }
      ctx.lineTo(pos.x,pos.y);
      ctx.stroke();
      ctx.restore();
      if(Math.random()>0.85) plasmaSound();
    }
  });
}

// ─── SHOCKWAVE ────────────────────────────────
function addShockwave(x,y) {
  shockwaves.push({x,y,r:0,maxR:220,life:1,col:tc().accent});
}
function addEmber(x,y) {
  emberPool.push({x,y,vx:rand(-8,8),vy:rand(-12,-2),life:1,size:rand(2,6),col:tc().fire[Math.floor(Math.random()*3)]});
}
function drawShockwaves() {
  for(let i=shockwaves.length-1;i>=0;i--) {
    const s=shockwaves[i];
    s.r+=(s.maxR-s.r)*0.12; s.life-=0.03;
    if(s.life<=0){shockwaves.splice(i,1);continue;}
    ctx.save();
    ctx.globalCompositeOperation='screen';
    // Outer ring
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.strokeStyle=s.col; ctx.lineWidth=4*s.life;
    ctx.globalAlpha=s.life; ctx.shadowBlur=20; ctx.shadowColor=s.col; ctx.stroke();
    // Inner ring
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*0.5,0,Math.PI*2);
    ctx.strokeStyle='#fff'; ctx.lineWidth=2*s.life;
    ctx.globalAlpha=s.life*0.5; ctx.stroke();
    ctx.restore();
  }
  // Embers
  for(let i=emberPool.length-1;i>=0;i--) {
    const e=emberPool[i];
    e.x+=e.vx; e.y+=e.vy; e.vy+=0.25; e.life-=0.025; e.vx*=0.98;
    if(e.life<=0){emberPool.splice(i,1);continue;}
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.beginPath(); ctx.arc(e.x,e.y,e.size*e.life,0,Math.PI*2);
    ctx.fillStyle=e.col; ctx.globalAlpha=e.life; ctx.fill();
    ctx.restore();
  }
}

// ─── FINGERTIP GLOW ───────────────────────────
function drawFingertipGlow(px,py,col) {
  ctx.save();
  ctx.globalCompositeOperation='screen';
  // Multi-layer glow
  [30,15,6].forEach((blur,i)=>{
    ctx.beginPath();
    ctx.arc(px,py,8-i*2,0,Math.PI*2);
    ctx.fillStyle=i===2?'#fff':col;
    ctx.shadowBlur=blur;
    ctx.shadowColor=col;
    ctx.globalAlpha=i===2?1:0.6;
    ctx.fill();
  });
  ctx.restore();
}

// ─── HAND SKELETON ────────────────────────────
function drawSkeleton(hand) {
  const col=tc().accent+'66';
  ctx.save();
  ctx.globalCompositeOperation='screen';
  drawConnectors(ctx, hand, HAND_CONNECTIONS, {color:col, lineWidth:1});
  ctx.restore();
}

// ─── MAIN LOOP ────────────────────────────────
function mainLoop(ts) {
  requestAnimationFrame(mainLoop);
  const dt=(ts-lastT)/1000; lastT=ts; time+=dt;

  fFrames++;
  if(ts>lastFpsT+1000){uF.textContent=fFrames;fFrames=0;lastFpsT=ts;}

  // Clear with pure black fade
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.fillRect(0,0,W,H);

  if(hands.length===0) {
    // Idle — draw ambient plasma in center
    ctx.save();
    const pulse=0.5+Math.sin(time*2)*0.2;
    const grd=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,150*pulse);
    grd.addColorStop(0,tc().plasma+'15');
    grd.addColorStop(1,'transparent');
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(W/2,H/2,150*pulse,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  if(hands.length>0) {

    hands.forEach((hand,hi)=>{
      // Draw skeleton (subtle)
      drawSkeleton(hand);

      // Collect fingertip positions
      const tipPositions = FTIPS.map(ti=>pt(hand[ti]));

      // Update ribbon trails
      updateRibbons(tipPositions);

      // FIRE from each fingertip
      FTIPS.forEach((ti,idx)=>{
        const p=pt(hand[ti]);
        const intensity=1+(handVel*20);
        for(let j=0;j<Math.ceil(3+handVel*15);j++) spawnFire(p.x,p.y,intensity);
        drawFingertipGlow(p.x,p.y,tc().fire[0]);
      });
    });

    // Ribbon trails
    drawRibbons();

    // PLASMA BALL — when 2 hands detected
    if(hands.length>=2) {
      const p1=pt(hands[0][0]); // palm 0
      const p2=pt(hands[1][0]); // palm 1
      const dist2=d(p1,p2);
      const cx=(p1.x+p2.x)/2, cy=(p1.y+p2.y)/2;
      const radius=Math.max(20,Math.min(dist2*0.25,100));

      drawPlasma(cx,cy,radius,1);

      // Arc from plasma to all fingertips
      const allTips=[
        ...FTIPS.map(t=>pt(hands[0][t])),
        ...FTIPS.map(t=>pt(hands[1][t]))
      ];
      drawPlasmaArcs(cx,cy,allTips);

      // Hum audio
      updateHum(2,dist2/Math.max(W,H));
      plasmaInd.style.display='flex';
      uM.textContent='FIRE+PLASMA';
    } else {
      plasmaInd.style.display='none';
      updateHum(hands.length,1);
      uM.textContent='FIRE';
    }

    detectGesture();
  } else {
    plasmaInd.style.display='none';
  }

  // Draw all fire particles
  drawFire();
  drawShockwaves();

  uH.textContent=hands.length;
}

// ─── MEDIAPIPE ────────────────────────────────
function initMediaPipe() {
  const mp = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  mp.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.75,minTrackingConfidence:0.75});
  mp.onResults(res=>{
    if(!aCtx)return;
    const prev=hands.length>0?hands[0][8]:null;
    hands=res.multiHandLandmarks||[];
    if(prev&&hands.length>0) {
      const cur=hands[0][8];
      handVel=d(prev,cur);
    } else handVel=0;
  });
  const cam=new Camera(video,{
    onFrame:async()=>await mp.send({image:video}),
    width:1280,height:720,facingMode:'user'
  });
  cam.start();
}
</script>
